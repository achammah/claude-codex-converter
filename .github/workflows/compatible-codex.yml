name: Compatible Codex releases

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatible-codex-release
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.discovery.outputs.build }}
      matrix: ${{ steps.discovery.outputs.matrix }}
      release_id: ${{ steps.discovery.outputs.release_id }}
      sequence: ${{ steps.discovery.outputs.sequence }}
      feed_url: ${{ steps.discovery.outputs.feed_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Discover exact upstream candidate
        id: discovery
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci_release.py discover --repository "$RELEASE_REPOSITORY" --work release-work
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-inputs
          path: release-work/
          if-no-files-found: error

  verify:
    needs: discover
    if: needs.discover.outputs.build == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-inputs
          path: release-work
      - name: Install verification dependencies
        run: python -m pip install . pyte
      - name: Build and exercise exact runtime
        env:
          RELEASE_ID: ${{ needs.discover.outputs.release_id }}
          RELEASE_SEQUENCE: ${{ needs.discover.outputs.sequence }}
          FEED_URL: ${{ needs.discover.outputs.feed_url }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: >-
          python scripts/release_runner.py
          --candidate release-work/candidate.json
          --manifest release-work/native/manifest.json
          --work "${RUNNER_TEMP}/native-build"
          --output "release-output/${RELEASE_TARGET}"
          --release-id "${RELEASE_ID}-${RELEASE_TARGET}"
          --sequence "$RELEASE_SEQUENCE"
          --feed-url "$FEED_URL"
      - name: Package verified runtime
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/ci_package.py --work release-work --result "release-output/${RELEASE_TARGET}"
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-build/*.log
            ${{ runner.temp }}/native-build/*/report.json
            release-output/${{ matrix.target }}/evidence.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.target }}
          path: release-output/${{ matrix.target }}/
          if-no-files-found: error

  publish:
    needs: [discover, verify]
    if: needs.discover.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-inputs
          path: release-work
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: runtime-*
          path: downloaded-runtimes
      - name: Verify hosted assets and advance stable feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci_release.py publish --repository "$RELEASE_REPOSITORY" --work release-work --artifacts downloaded-runtimes

  report-failure:
    needs: [discover, verify, publish]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record compatibility failure without offering update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/ci_release.py report-failure --repository "$RELEASE_REPOSITORY" --work release-failure
